<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সাংস্কৃতিক অনুষ্ঠান | সোনাগাজী কালচারাল ফোরাম, ফেনী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><strong>সোনাগাজী কালচারাল ফোরাম</strong><span>ফেনী, বাংলাদেশ</span></div>
  <nav class="menu">
    <a href="index.html">হোম</a>
    <a href="about.html">আমাদের সম্পর্কে</a>
    <a href="events.html" class="active">অনুষ্ঠান</a>
    <a href="leaders.html">নেতৃত্ব</a>
    <a href="gallery.html">গ্যালারি</a>
    <a href="contact.html">যোগাযোগ</a>
  </nav>
</div></header>

<section class="page-head">
  <h1>সাংস্কৃতিক অনুষ্ঠান</h1>
  <p>আমাদের আসন্ন, চলমান ও সম্পন্ন অনুষ্ঠানসমূহ</p>
</section>

<main>
  <div class="chips" id="chips">
    <button class="on" data-f="all">সব</button>
    <button data-f="upcoming">আসন্ন</button>
    <button data-f="ongoing">চলমান</button>
    <button data-f="done">সম্পন্ন</button>
  </div>
  <div class="grid" id="grid"><p class="state">লোড হচ্ছে…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async function () {
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const grid = document.getElementById('grid');
  const label = { upcoming: '● আসন্ন', ongoing: '● চলমান', done: '✓ সম্পন্ন' };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });

  const { data, error } = await sb.from('events').select('*').order('event_date', { ascending: false });
  if (error) { grid.innerHTML = ''; grid.appendChild(el('p', 'state', 'ইভেন্ট লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।')); return; }

  function render(filter) {
    const list = data.filter(e => filter === 'all' || e.status === filter);
    grid.innerHTML = '';
    if (!list.length) { grid.appendChild(el('p', 'state', 'এই তালিকায় এখনো কোনো অনুষ্ঠান নেই।')); return; }
    list.forEach(ev => {
      const card = el('article', 'card');
      if (ev.image_url) { const i = el('img'); i.src = ev.image_url; i.alt = ev.title; i.loading = 'lazy'; card.appendChild(i); }
      const body = el('div', 'card-body');
      body.appendChild(el('span', 'badge' + (ev.status === 'done' ? ' done' : ''), label[ev.status] || ''));
      body.appendChild(el('h3', '', ev.title));
      const meta = el('div', 'meta');
      if (ev.event_date) meta.appendChild(el('span', '', '📅 ' + fmt(ev.event_date)));
      if (ev.venue) meta.appendChild(el('span', '', '📍 ' + ev.venue));
      body.appendChild(meta);
      if (ev.description) body.appendChild(el('p', '', ev.description));
      card.appendChild(body); grid.appendChild(card);
    });
  }

  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('on', x === b));
    render(b.dataset.f);
  });
  render('all');
})();
</script>
</body>
</html>
