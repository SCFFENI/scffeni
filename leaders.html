<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নেতৃত্ব | সোনাগাজী কালচারাল ফোরাম, ফেনী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-wrap">
    <img id="logo" class="logo" alt="লোগো" hidden>
    <div class="brand"><strong>সোনাগাজী কালচারাল ফোরাম</strong><span>ফেনী, বাংলাদেশ</span></div>
  </div>
  <nav class="menu">
    <a href="index.html">হোম</a>
    <a href="about.html">আমাদের সম্পর্কে</a>
    <a href="events.html">অনুষ্ঠান</a>
    <a href="leaders.html" class="active">নেতৃত্ব</a>
    <a href="gallery.html">গ্যালারি</a>
    <a href="contact.html">যোগাযোগ</a>
  </nav>
</div></header>

<section class="page-head">
  <h1>আমাদের নেতৃত্ব</h1>
  <p>যাঁরা ফোরামকে এগিয়ে নিয়ে যাচ্ছেন</p>
</section>

<main>
  <div class="grid" id="grid"><p class="state">লোড হচ্ছে…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async function () {
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const grid = document.getElementById('grid');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

  sb.from('settings').select('value').eq('key', 'logo_url').maybeSingle().then(({ data }) => {
    if (data && data.value) { const i = document.getElementById('logo'); i.src = data.value; i.hidden = false; }
  });

  const { data, error } = await sb.from('leaders').select('*')
    .order('sort', { ascending: true }).order('created_at', { ascending: true });
  grid.innerHTML = '';
  if (error) { grid.appendChild(el('p', 'state', 'তথ্য লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।')); return; }
  if (!data.length) { grid.appendChild(el('p', 'state', 'এখনো কোনো তথ্য যোগ করা হয়নি।')); return; }

  data.forEach(l => {
    const card = el('article', 'card person');
    if (l.photo_url) { const i = el('img', 'avatar'); i.src = l.photo_url; i.alt = l.name; i.loading = 'lazy'; card.appendChild(i); }
    else card.appendChild(el('div', 'avatar', (l.name || '?').trim().charAt(0)));
    card.appendChild(el('h3', '', l.name));
    if (l.role) card.appendChild(el('div', 'role', l.role));
    if (l.bio) card.appendChild(el('p', 'bio', l.bio));
    const soc = el('div', 'socials');
    [['facebook', 'ফেসবুক'], ['youtube', 'ইউটিউব'], ['linkedin', 'লিংকডইন']].forEach(([k, t]) => {
      if (l[k]) { const a = el('a', '', t); a.href = l[k]; a.target = '_blank'; a.rel = 'noopener'; soc.appendChild(a); }
    });
    if (soc.children.length) card.appendChild(soc);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
