<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>গ্যালারি | সোনাগাজী কালচারাল ফোরাম, ফেনী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand-wrap">
    <img id="logo" class="logo" alt="লোগো" hidden>
    <div class="brand"><strong>সোনাগাজী কালচারাল ফোরাম</strong><span>ফেনী, বাংলাদেশ</span></div>
  </div>
  <nav class="menu">
    <a href="index.html">হোম</a>
    <a href="about.html">আমাদের সম্পর্কে</a>
    <a href="events.html">অনুষ্ঠান</a>
    <a href="leaders.html">নেতৃত্ব</a>
    <a href="gallery.html" class="active">গ্যালারি</a>
    <a href="contact.html">যোগাযোগ</a>
  </nav>
</div></header>

<section class="page-head">
  <h1>ফটো গ্যালারি</h1>
  <p>আমাদের স্মরণীয় মুহূর্তগুলো</p>
</section>

<main>
  <div class="chips" id="chips"></div>
  <div class="photos" id="photos"><p class="state">লোড হচ্ছে…</p></div>
</main>

<div id="lb"><img alt=""><p></p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async function () {
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const box = document.getElementById('photos'), chips = document.getElementById('chips');
  const lb = document.getElementById('lb');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

  sb.from('settings').select('value').eq('key', 'logo_url').maybeSingle().then(({ data }) => {
    if (data && data.value) { const i = document.getElementById('logo'); i.src = data.value; i.hidden = false; }
  });

  const { data, error } = await sb.from('gallery').select('*').order('created_at', { ascending: false }).limit(300);
  box.innerHTML = '';
  if (error) { box.appendChild(el('p', 'state', 'ছবি লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।')); return; }
  if (!data.length) { box.appendChild(el('p', 'state', 'এখনো কোনো ছবি যোগ করা হয়নি।')); return; }

  function render(cat) {
    box.innerHTML = '';
    data.filter(g => cat === 'all' || g.category === cat).forEach(g => {
      const b = el('button', 'photo'); b.type = 'button';
      const i = el('img'); i.src = g.image_url; i.alt = g.title || 'গ্যালারির ছবি'; i.loading = 'lazy'; b.appendChild(i);
      if (g.title) b.appendChild(el('div', 'cap', g.title));
      b.onclick = () => { lb.querySelector('img').src = g.image_url; lb.querySelector('p').textContent = g.title || ''; lb.classList.add('on'); };
      box.appendChild(b);
    });
  }

  const cats = [...new Set(data.map(g => g.category).filter(Boolean))];
  if (cats.length) {
    [['all', 'সব'], ...cats.map(c => [c, c])].forEach(([v, t], idx) => {
      const b = el('button', idx === 0 ? 'on' : '', t);
      b.onclick = () => { chips.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(v); };
      chips.appendChild(b);
    });
  }
  render('all');

  lb.onclick = () => lb.classList.remove('on');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });
})();
</script>
</body>
</html>
